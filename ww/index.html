<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>steadfast</title>
<style>
:root{--bg:#0b0912;--card:#121018;--line:#2a2733;--text:#c9c5d3;--mute:#7d7889;--p:#7e57c2;--pl:#9a7ae0;--pd:#1f1638;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle at 20% 0,#1a1030,var(--bg) 55%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(126,87,194,.18),transparent 65%);top:-120px;right:-140px;pointer-events:none;animation:drift 14s ease-in-out infinite alternate}
#app{max-width:480px;margin:0 auto;padding:20px 20px 120px;min-height:100vh;position:relative}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.logo{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:700;color:#d8d4e2}
.ico{width:44px;height:44px;border-radius:14px;background:var(--pd);border:1px solid var(--p);display:grid;place-items:center;color:var(--pl)}
.ico svg{width:24px;height:24px}
.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-weight:600}
h1{font-size:40px;line-height:1.1;margin:8px 0;color:#d4d0de;letter-spacing:-1px}
h1 em{font-style:normal;color:var(--p)}
h2{font-size:24px;color:#d4d0de;letter-spacing:-.5px;margin:6px 0 14px}
.sub{color:var(--mute);margin-bottom:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:20px;margin-bottom:16px;transition:border-color .3s}
.row{display:flex;align-items:center;gap:14px}
.grow{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.sq{width:60px;height:60px;border-radius:18px;background:var(--pd);display:grid;place-items:center;color:var(--pl);border:0;cursor:pointer;transition:transform .25s var(--spring),box-shadow .3s}
.sq.fill{background:var(--p);color:#fff}
.sq.fill:hover{transform:rotate(90deg) scale(1.06);box-shadow:0 8px 24px rgba(126,87,194,.4)}
.sq:active{transform:scale(.92)}
.sq svg{width:26px;height:26px}
.dashed{border:1px dashed var(--line);border-radius:26px;padding:36px 20px;text-align:center;margin-bottom:16px}
.dashed .ico{margin:0 auto 16px;width:64px;height:64px;border-radius:20px;border:0;animation:float 4s ease-in-out infinite}
.dashed p{color:var(--mute);margin:8px 0 20px}
.btn{background:var(--p);color:#fff;border:0;border-radius:18px;padding:16px 26px;font-size:17px;font-weight:600;cursor:pointer;display:inline-flex;gap:8px;align-items:center;transition:transform .2s var(--ease),box-shadow .3s,opacity .3s,background .3s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 28px rgba(126,87,194,.4)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--pl);font-size:16px;font-weight:600;cursor:pointer;transition:transform .2s var(--ease),opacity .2s}
.link:hover{transform:translateX(3px)}
.ring{position:relative;width:110px;height:110px;flex:none}
.ring svg{transform:rotate(-90deg)}
#ringfg{transition:stroke-dashoffset 1.1s var(--ease)}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:26px;font-weight:700}
.ring small{font-size:11px;letter-spacing:.15em;color:var(--mute);font-weight:500}
.habit{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;transition:border-color .3s,transform .25s var(--ease),background .3s;max-height:140px}
.habit:hover{border-color:var(--c);transform:translateY(-2px)}
.habit.new{animation:rise .6s var(--ease) both}
.habit.out{animation:out .32s ease forwards;pointer-events:none}
.hi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);transition:transform .35s var(--spring)}
.hi svg{width:22px;height:22px}
.habit:hover .hi{transform:rotate(-8deg) scale(1.08)}
.habit.pop .hi{animation:bump .6s var(--spring)}
.chk{width:36px;height:36px;border-radius:12px;border:2px solid var(--c);background:transparent;cursor:pointer;display:grid;place-items:center;color:#fff;flex:none;transition:transform .2s var(--spring)}
.chk:hover{transform:scale(1.1)}
.chk:active{transform:scale(.88)}
.chk path{stroke-dasharray:1;stroke-dashoffset:0}
.habit.done .chk{background:var(--c)}
.habit.done .name{text-decoration:line-through;opacity:.6}
.habit.pop .chk{animation:pop .5s var(--spring),glow .6s ease-out}
.habit.pop .chk path{animation:draw .45s .1s ease both}
.name{font-weight:600;color:#d8d4e2;word-break:break-word;transition:opacity .3s}
.meta{font-size:13px;color:var(--mute);margin-top:2px}
.tag{font-size:11px;padding:2px 8px;border-radius:8px;border:1px solid var(--c);color:var(--c);margin-right:6px}
.del{background:none;border:0;color:var(--mute);cursor:pointer;padding:6px;transition:color .2s,transform .2s var(--spring)}
.del:hover{color:#c25b4f;transform:scale(1.2) rotate(-8deg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:20px;transition:transform .3s var(--ease),border-color .3s}
.stat:hover{transform:translateY(-3px);border-color:#3a3548}
.stat b{display:block;font-size:40px;margin:14px 0 4px;color:#d4d0de}
.stat span{color:var(--mute)}
.bars{display:flex;gap:8px;height:150px;align-items:flex-end;margin-top:14px}
.bar{flex:1;height:100%;background:#1a1822;border-radius:12px;display:flex;align-items:flex-end;overflow:hidden}
.bar i{display:block;width:100%;min-height:6px;background:var(--p);border-radius:12px;transition:height 1s var(--ease)}
.lbls{display:flex;gap:8px;margin-top:8px}.lbls span{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.pbar{height:8px;background:#1a1822;border-radius:8px;margin-top:6px;overflow:hidden}.pbar i{display:block;height:100%;border-radius:8px;transition:width 1s var(--ease)}
.pname{display:flex;gap:8px;align-items:center;min-width:0}
.pname svg{width:18px;height:18px;flex:none}
.set{display:flex;align-items:center;gap:16px;padding:20px;border-bottom:1px solid var(--line);transition:background .25s}
.set[onclick]:hover{background:rgba(126,87,194,.06)}
.set:last-child{border:0}.set .ico{border:0;border-radius:16px;width:52px;height:52px}
.set b{display:block;color:#d8d4e2}.set span{color:var(--mute);font-size:14px}
.tog{width:56px;height:32px;border-radius:16px;background:#2a2733;position:relative;cursor:pointer;border:0;flex:none;transition:background .3s}
.tog.on{background:var(--p)}
.tog::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#111;transition:left .35s var(--spring)}
.tog.on::after{left:28px}
.tip{background:#171229;border-color:#2b2150}
.card.row>span:first-child svg{animation:twinkle 3s ease-in-out infinite}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;width:calc(100% - 32px);max-width:448px;background:rgba(18,16,24,.95);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:30px;padding:10px;display:flex;justify-content:space-between;z-index:5}
nav button{background:none;border:0;color:var(--mute);padding:14px 18px;border-radius:20px;display:flex;gap:10px;align-items:center;font-size:16px;font-weight:600;cursor:pointer;transition:color .25s,transform .2s var(--spring)}
nav button:hover{color:var(--pl)}
nav button:active{transform:scale(.9)}
nav button.act{background:#241a40;color:var(--pl)}
nav svg{width:24px;height:24px}
nav.enter button.act{animation:pillIn .5s var(--spring) both}
nav.enter .lbl{animation:lbl .45s .05s var(--ease) both}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10;opacity:0;visibility:hidden;backdrop-filter:blur(0);transition:opacity .3s ease,visibility .3s,backdrop-filter .3s}
.modal.show{opacity:1;visibility:visible;backdrop-filter:blur(4px)}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:30px;padding:28px;width:100%;max-width:440px;max-height:calc(100vh - 40px);overflow-y:auto;position:relative;transform:translateY(30px) scale(.95);transition:transform .45s var(--ease)}
.modal.show .sheet{transform:none}
.sheet .x{position:absolute;right:22px;top:22px;background:none;border:0;color:var(--mute);cursor:pointer;font-size:26px;transition:transform .3s var(--spring),color .2s}
.sheet .x:hover{transform:rotate(90deg);color:#fff}
label{display:block;font-weight:600;color:var(--mute);margin:22px 0 10px}
input[type=text]{width:100%;background:#0c0a12;border:1px solid var(--p);border-radius:16px;padding:18px;color:#ddd;font-size:17px;outline:none;transition:box-shadow .3s,border-color .3s}
input[type=text]:focus{box-shadow:0 0 0 4px rgba(126,87,194,.22)}
.seg{display:flex;gap:12px;margin-top:16px}
.seg button{flex:1;padding:16px;border-radius:16px;background:#16141c;border:1px solid var(--line);color:var(--mute);font-size:17px;font-weight:600;cursor:pointer;transition:background .3s,border-color .3s,color .3s,transform .2s var(--spring)}
.seg button:active{transform:scale(.95)}
.seg button.sel{background:#201637;border-color:var(--p);color:var(--pl)}
.cols{display:flex;gap:14px}
.cols button{width:40px;height:40px;border-radius:50%;border:2px solid transparent;cursor:pointer;outline:2px solid transparent;outline-offset:3px;transition:transform .3s var(--spring),outline-color .3s}
.cols button:hover{transform:scale(1.12)}
.cols button.sel{outline-color:#555;transform:scale(1.18)}
.icons{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;--sc:#7e57c2}
.icons button{aspect-ratio:1;border-radius:14px;background:#16141c;border:1px solid var(--line);color:var(--mute);cursor:pointer;display:grid;place-items:center;transition:transform .3s var(--spring),background .3s,border-color .3s,color .3s}
.icons button svg{width:22px;height:22px}
.icons button:hover{transform:translateY(-2px) scale(1.06);color:var(--sc)}
.icons button:active{transform:scale(.9)}
.icons button.sel{border-color:var(--sc);color:var(--sc);background:color-mix(in srgb,var(--sc) 16%,transparent);transform:scale(1.08)}
.iname{font-size:13px;color:var(--mute);margin-top:10px;min-height:18px}

#app.enter>*{animation:rise .65s var(--ease) both;animation-delay:calc(var(--i)*60ms)}

@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes out{from{opacity:1;max-height:140px;transform:none}to{opacity:0;max-height:0;margin-bottom:0;padding-top:0;padding-bottom:0;transform:translateX(40px) scale(.95);border-width:0}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes bump{0%{transform:scale(1) rotate(0)}40%{transform:scale(1.25) rotate(-10deg)}100%{transform:scale(1) rotate(0)}}
@keyframes glow{from{box-shadow:0 0 0 0 var(--c)}to{box-shadow:0 0 0 16px transparent}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1) rotate(0)}50%{opacity:.6;transform:scale(1.12) rotate(12deg)}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-60px,80px)}}
@keyframes pillIn{from{transform:scale(.8);opacity:.5}to{transform:none;opacity:1}}
@keyframes lbl{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important;transition-delay:0s!important}
}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>

<div class="modal" id="modal">
  <div class="sheet">
    <button class="x" onclick="closeModal()" aria-label="Close">×</button>
    <div class="eyebrow">New intention</div>
    <h2 style="font-size:32px;margin-top:16px">What matters to you?</h2>
    <label>I want to…</label>
    <input type="text" id="txt" maxlength="80" placeholder="e.g. Read for 20 minutes" oninput="validate()">
    <div class="seg">
      <button id="bDo" class="sel" onclick="setType('do')">✓ Do this</button>
      <button id="bAvoid" onclick="setType('avoid')">✕ Avoid this</button>
    </div>
    <label>Choose a symbol</label>
    <div class="icons" id="icons"></div>
    <div class="iname" id="iname"></div>
    <label>Choose a color</label>
    <div class="cols" id="cols"></div>
    <button class="btn" id="addBtn" style="width:100%;justify-content:center;margin-top:28px" onclick="addHabit()" disabled>Add to my routine →</button>
  </div>
</div>

<script>
const COLORS=["#7e57c2","#4a7fd0","#3f9f6c","#c4963a","#c25b4f"];
const I={
 leaf:'<path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15M5 19c2-5 5-8 9-10"/>',
 home:'<path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/>',
 list:'<path d="M3 6l2 2 3-3M3 14l2 2 3-3M12 7h9M12 15h9M12 19h9"/>',
 stats:'<path d="M4 3v18h17M9 17v-6M14 17V7M19 17v-4"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
 bell:'<path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 21h4"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 check:'<path pathLength="1" d="M5 12l5 5 9-10"/>',
 q:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 015 .5c0 1.5-2.5 2-2.5 3.5M12 17h.01"/>',
 spark:'<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>',
 target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
 flame:'<path d="M12 3c1 4 5 5 5 10a5 5 0 01-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>',
 trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
 right:'<path d="M9 5l7 7-7 7"/>',
 /* habit symbols */
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9.5 9.5l5 5M14.5 9.5l-5 5"/>',
 ban:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
 book:'<path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>',
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
 wind:'<path d="M9.6 4.6A2 2 0 1111 8H2M12.6 19.4A2 2 0 1014 16H2M17.7 7.7A2.5 2.5 0 1119.5 12H2"/>',
 heart:'<path d="M12 20s-8-5-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 9c0 6-8 11-8 11z"/>',
 dumbbell:'<path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/>',
 moon:'<path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/>',
 drop:'<path d="M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z"/>',
 coffee:'<path d="M4 9h13v5a5 5 0 01-5 5H9a5 5 0 01-5-5zM17 10h1.5a2.5 2.5 0 010 5H17M8 3v3M12 3v3"/>',
 music:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
 pencil:'<path d="M4 20l1-4L16 5l3 3L8 19zM14 7l3 3"/>',
 smile:'<circle cx="12" cy="12" r="9"/><path d="M8.5 14a4.5 4.5 0 007 0M9 9.5h.01M15 9.5h.01"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 phone:'<rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/>',
 coin:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M14.5 9.5c-.5-1-4-1.5-4 .5s4 1.5 4 3.5-3.5 1.5-4 .5"/>',
 brief:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2"/>',
 star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>'
};
const SYMBOLS=[
 ["shield","Protect / avoid"],["ban","Stop / quit"],["book","Learning"],["globe","Language"],["wind","Fresh air"],
 ["dumbbell","Exercise"],["heart","Health"],["drop","Hydration"],["moon","Sleep"],["sun","Morning / sunlight"],
 ["smile","Mindfulness"],["pencil","Writing"],["music","Music"],["coffee","Caffeine / drinks"],["phone","Screen time"],
 ["coin","Money"],["brief","Work"],["leaf","Nature"],["star","Goal"],["target","Focus"]
];
const ic=(n,s)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"${s?` style="width:${s}px;height:${s}px"`:''}>${I[n]}</svg>`;
const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iconOf=h=>(h.icon&&I[h.icon])?h.icon:(h.type==='avoid'?'shield':'target');
const reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const KEY="steadfast_v1";
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{habits:[],checks:{},reminders:false};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const dkey=d=>{const t=new Date(d);return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")};
const today=()=>dkey(new Date());
const dayOffset=n=>{const d=new Date();d.setDate(d.getDate()-n);return d};
const done=(id,k)=>(S.checks[k]||[]).includes(id);
let tab="today",type="do",color=COLORS[0],icon="target",iconTouched=false;
let animate=true,popId=null,newId=null,prevPct=0,curPct=0;

function toggle(id){
  const k=today();S.checks[k]=S.checks[k]||[];
  const i=S.checks[k].indexOf(id);
  if(i>=0)S.checks[k].splice(i,1);else{S.checks[k].push(id);popId=id}
  save();render();popId=null;
}
function streak(id){
  let n=0,i=done(id,today())?0:1;
  for(;i<3650;i++){if(done(id,dkey(dayOffset(i))))n++;else break}
  return n;
}
function bestStreak(){
  let best=0;
  S.habits.forEach(h=>{
    let run=0;
    for(let i=730;i>=0;i--){
      if(done(h.id,dkey(dayOffset(i)))){run++;best=Math.max(best,run)}else run=0;
    }
  });
  return best;
}
const total=()=>Object.values(S.checks).reduce((a,b)=>a+b.length,0);

function habitRow(h){
  const d=done(h.id,today()),st=streak(h.id);
  return `<div class="habit ${d?'done':''} ${popId===h.id?'pop':''} ${newId===h.id?'new':''}" data-id="${h.id}" style="--c:${h.color}">
    <button class="chk" onclick="toggle('${h.id}')" aria-label="Check in">${d?ic('check',20):''}</button>
    <div class="hi">${ic(iconOf(h))}</div>
    <div class="grow"><div class="name">${esc(h.text)}</div>
    <div class="meta"><span class="tag">${h.type==='do'?'Do':'Avoid'}</span>${st?st+' day streak':(h.type==='do'?'Not done yet':'Avoided today? Tap to check in')}</div></div></div>`;
}
const emptyCard=(t,p)=>`<div class="dashed"><div class="ico">${ic('target')}</div><h2 style="margin:0">${t}</h2><p>${p}</p><button class="btn" onclick="openModal()">${ic('plus',20)} Add a habit</button></div>`;

function pToday(){
  const n=S.habits.length,c=S.habits.filter(h=>done(h.id,today())).length;
  const pct=n?Math.round(c/n*100):0,C=2*Math.PI*46;
  curPct=pct;
  const startOff=C*(1-prevPct/100),endOff=C*(1-pct/100);
  const dt=new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
  return `<div class="top"><div><div class="eyebrow">${dt}</div><h1>Small steps.<br><em>Real change.</em></h1></div>
    <div class="ring"><svg width="110" height="110" viewBox="0 0 110 110"><circle cx="55" cy="55" r="46" fill="none" stroke="#1d1a26" stroke-width="12"/><circle id="ringfg" data-t="${endOff}" cx="55" cy="55" r="46" fill="none" stroke="#7e57c2" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${startOff}"/></svg><div><span class="cnt" data-to="${pct}" data-from="${prevPct}" data-suf="%">${prevPct}%</span><small>TODAY</small></div></div></div>
    <div class="card row" style="margin-top:24px"><span style="color:var(--pl)">${ic('spark',28)}</span><div><b style="color:#d8d4e2">Consistency over intensity.</b><div class="sub" style="margin:4px 0 0">Keep showing up for the person you’re becoming.</div></div></div>
    <div class="eyebrow" style="margin-top:34px">Your routine</div>
    <div class="top" style="align-items:center"><h2>Today’s intentions</h2><button class="link" onclick="go('habits')">Manage ›</button></div>
    ${n?S.habits.map(habitRow).join(''):emptyCard('Make your first promise','Choose one thing you want to do more of or avoid.<br>You can keep it simple.')}`;
}
function pHabits(){
  return `<div class="top"><div><div class="eyebrow">Build your baseline</div><h1>All habits</h1></div><button class="sq fill" onclick="openModal()" aria-label="Add">${ic('plus')}</button></div>
  <p class="sub">A little structure makes room for a lot of progress.</p>
  ${S.habits.length?S.habits.map(h=>`<div class="habit ${newId===h.id?'new':''}" data-id="${h.id}" style="--c:${h.color}"><div class="hi">${ic(iconOf(h))}</div><div class="grow"><div class="name">${esc(h.text)}</div><div class="meta"><span class="tag">${h.type==='do'?'Do':'Avoid'}</span>${total()?countFor(h.id)+' check-ins':'No check-ins yet'}</div></div><button class="del" onclick="delHabit('${h.id}')" aria-label="Delete">${ic('trash',22)}</button></div>`).join(''):emptyCard('Your list is clear','Add an intention and make it yours.')}`;
}
const countFor=id=>Object.values(S.checks).filter(a=>a.includes(id)).length;
function pStats(){
  const n=S.habits.length,days=[];
  for(let i=6;i>=0;i--)days.push(dayOffset(i));
  const counts=days.map(d=>(S.checks[dkey(d)]||[]).filter(id=>S.habits.some(h=>h.id===id)).length);
  const wk=counts.reduce((a,b)=>a+b,0),rhythm=n?Math.round(wk/(n*7)*100):0,max=Math.max(n,1);
  const box=(i,v,l,c,suf='')=>`<div class="stat"><div class="ico" style="color:${c};border:0;width:44px;height:44px;border-radius:14px;background:${c}22">${ic(i)}</div><b class="cnt" data-to="${v}" data-from="0" data-suf="${suf}">0${suf}</b><span>${l}</span></div>`;
  const mx=Math.max(1,...S.habits.map(x=>countFor(x.id)));
  return `<div class="top"><div><div class="eyebrow">Your progress</div><h1>Stats</h1></div><div class="sq" style="cursor:default">${ic('stats')}</div></div>
  <p class="sub">Notice what’s working. Keep going.</p>
  <div class="grid">${box('check',total(),'Total check-ins','#7e57c2')}${box('target',n,'Active habits','#4a7fd0')}${box('flame',bestStreak(),'Best habit streak','#c4963a')}${box('spark',rhythm,'Weekly rhythm','#3f9f6c','%')}</div>
  <div class="card"><div class="eyebrow">Last 7 days</div><div class="top" style="align-items:center"><h2 style="margin:6px 0">Showing up</h2><b style="color:var(--p)"><span class="cnt" data-to="${wk}" data-from="0">0</span> check-ins</b></div>
  <div class="bars">${counts.map((c,i)=>`<div class="bar"><i data-h="${c/max*100}" style="height:0;transition-delay:${i*70}ms"></i></div>`).join('')}</div>
  <div class="lbls">${days.map(d=>`<span>${d.toLocaleDateString("en-US",{month:"short",day:"numeric"})}</span>`).join('')}</div></div>
  <div class="card"><div class="eyebrow">By intention</div><h2>Where it adds up</h2>
  ${n?S.habits.map((h,i)=>{const c=countFor(h.id);return `<div style="margin-bottom:16px"><div class="top"><span class="name pname"><span style="color:${h.color};display:flex">${ic(iconOf(h))}</span>${esc(h.text)}</span><span class="meta">${c}</span></div><div class="pbar"><i data-w="${Math.min(100,c/mx*100)}" style="width:0;transition-delay:${i*90}ms;background:${h.color}"></i></div></div>`}).join(''):'<p class="sub" style="margin:0">Add a habit to start seeing your rhythm.</p>'}</div>`;
}
function pSettings(){
  return `<div class="top"><div><div class="eyebrow">Your space</div><h1>Settings</h1></div><div class="sq" style="cursor:default">${ic('gear')}</div></div>
  <p class="sub">Keep your practice calm and intentional.</p>
  <div class="card" style="padding:0;overflow:hidden">
    <div class="set"><div class="ico">${ic('bell')}</div><div class="grow"><b>Gentle reminders</b><span>A nudge at 8 PM if habits are pending (browser must stay open).</span></div><button class="tog ${S.reminders?'on':''}" onclick="toggleRem(this)" aria-label="Toggle reminders"></button></div>
    <div class="set"><div class="ico">${ic('leaf')}</div><div class="grow"><b>Private by design</b><span>No ads. No subscriptions. No tracking. Data stays in your browser.</span></div><span style="color:#3f9f6c">${ic('check',26)}</span></div>
    <div class="set" style="cursor:pointer" onclick="alert('steadfast: open source habit tracking for everyday people.\\n\\nAll data is stored locally in your browser (localStorage). Nothing is ever sent anywhere.')"><div class="ico">${ic('q')}</div><div class="grow"><b>About steadfast</b><span>Open source habit tracking for everyday people.</span></div><span style="color:var(--mute)">${ic('right',22)}</span></div>
    <div class="set" style="cursor:pointer" onclick="resetAll()"><div class="ico" style="color:#c25b4f">${ic('trash')}</div><div class="grow"><b>Erase all data</b><span>Remove every habit and check-in from this browser.</span></div></div>
  </div>
  <div class="card tip row"><span style="color:var(--pl)">${ic('spark',28)}</span><div><b style="color:#d8d4e2">Progress, not perfection.</b><div class="sub" style="margin:6px 0 0">You’ve logged ${total()} check-in${total()===1?'':'s'} so far. ${total()?'Keep it going.':'That’s proof you’re already changing.'}</div></div></div>`;
}
function countUp(el){
  const to=+el.dataset.to,from=+el.dataset.from||0,suf=el.dataset.suf||'';
  if(reduced||from===to){el.textContent=to+suf;return}
  const t0=performance.now(),dur=1000;
  (function f(t){
    const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);
    el.textContent=Math.round(from+(to-from)*e)+suf;
    if(p<1)requestAnimationFrame(f);
  })(t0);
}
function render(){
  const anim=animate;animate=false;
  if(anim)prevPct=0;
  const pages={today:pToday,habits:pHabits,stats:pStats,settings:pSettings};
  const app=document.getElementById("app");
  app.className=anim?"enter":"";
  app.innerHTML=`<header><div class="logo"><div class="ico">${ic('leaf')}</div>steadfast</div><div class="ico" style="border:0;background:#17141e;color:var(--text)">${ic('bell')}</div></header>`+pages[tab]();
  [...app.children].forEach((el,i)=>el.style.setProperty("--i",Math.min(i,10)));
  const tabs=[["today","home","Today"],["habits","list","Habits"],["stats","stats","Stats"],["settings","gear","Settings"]];
  const nav=document.getElementById("nav");
  nav.className=anim?"enter":"";
  nav.innerHTML=tabs.map(([k,i,l])=>`<button class="${tab===k?'act':''}" onclick="go('${k}')">${ic(i)}${tab===k?`<span class="lbl">${l}</span>`:''}</button>`).join('');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    app.querySelectorAll("[data-h]").forEach(e=>e.style.height=e.dataset.h+"%");
    app.querySelectorAll("[data-w]").forEach(e=>e.style.width=e.dataset.w+"%");
    const r=document.getElementById("ringfg");if(r)r.style.strokeDashoffset=r.dataset.t;
    app.querySelectorAll(".cnt").forEach(countUp);
  }));
  prevPct=curPct;
}
function go(t){tab=t;animate=true;render();window.scrollTo({top:0,behavior:reduced?"auto":"smooth"})}
function openModal(){
  document.getElementById("txt").value="";color=COLORS[0];iconTouched=false;
  setType("do");drawCols();validate();
  document.getElementById("modal").classList.add("show");
  document.getElementById("modal").querySelector(".sheet").scrollTop=0;
  setTimeout(()=>document.getElementById("txt").focus({preventScroll:true}),150);
}
function closeModal(){document.getElementById("modal").classList.remove("show");document.getElementById("txt").blur()}
function setType(t){
  type=t;
  document.getElementById("bDo").className=t==="do"?"sel":"";
  document.getElementById("bAvoid").className=t==="avoid"?"sel":"";
  if(!iconTouched)icon=t==="avoid"?"shield":"target"; // sensible default until the user picks one
  drawIcons();
}
function drawIcons(){
  const box=document.getElementById("icons");
  box.style.setProperty("--sc",color);
  box.innerHTML=SYMBOLS.map(([k,l])=>`<button type="button" class="${k===icon?'sel':''}" data-k="${k}" title="${l}" aria-label="${l}" onclick="pickIcon('${k}')">${ic(k)}</button>`).join('');
  const cur=SYMBOLS.find(s=>s[0]===icon);
  document.getElementById("iname").textContent=cur?cur[1]:"";
}
function pickIcon(k){
  icon=k;iconTouched=true;
  [...document.getElementById("icons").children].forEach(b=>b.classList.toggle("sel",b.dataset.k===k));
  const cur=SYMBOLS.find(s=>s[0]===k);
  document.getElementById("iname").textContent=cur?cur[1]:"";
}
function drawCols(){
  document.getElementById("cols").innerHTML=COLORS.map(c=>`<button data-c="${c}" class="${c===color?'sel':''}" style="background:${c}" onclick="pickColor('${c}')" aria-label="Color"></button>`).join('');
}
function pickColor(c){
  color=c;
  [...document.getElementById("cols").children].forEach(b=>b.classList.toggle("sel",b.dataset.c===c));
  document.getElementById("icons").style.setProperty("--sc",c);
}
function validate(){document.getElementById("addBtn").disabled=!document.getElementById("txt").value.trim()}
function addHabit(){
  const t=document.getElementById("txt").value.trim();
  if(!t)return;
  const id="h"+Date.now();
  S.habits.push({id,text:t,type,color,icon});
  save();closeModal();
  newId=id;render();newId=null;
}
function delHabit(id){
  if(!confirm("Delete this habit and its history?"))return;
  const finish=()=>{
    S.habits=S.habits.filter(h=>h.id!==id);
    Object.keys(S.checks).forEach(k=>S.checks[k]=S.checks[k].filter(x=>x!==id));
    save();render();
  };
  const el=document.querySelector(`[data-id="${id}"]`);
  if(el&&!reduced){el.classList.add("out");setTimeout(finish,330)}else finish();
}
function resetAll(){
  if(confirm("Erase ALL habits and check-ins? This cannot be undone.")){S={habits:[],checks:{},reminders:false};save();animate=true;render()}
}
async function toggleRem(btn){
  if(!S.reminders){
    if(!("Notification" in window)){alert("Notifications aren’t supported in this browser.");return}
    const p=await Notification.requestPermission();
    if(p!=="granted"){alert("Notification permission was not granted.");return}
  }
  S.reminders=!S.reminders;save();
  btn.classList.toggle("on",S.reminders);
}
setInterval(()=>{
  if(!S.reminders||!("Notification" in window)||Notification.permission!=="granted")return;
  const d=new Date(),flag="steadfast_notified";
  if(d.getHours()===20&&localStorage.getItem(flag)!==today()){
    const pending=S.habits.filter(h=>!done(h.id,today())).length;
    if(pending){new Notification("steadfast",{body:`${pending} intention${pending>1?'s':''} still waiting. Small steps count.`});localStorage.setItem(flag,today())}
  }
},60000);
document.getElementById("txt").addEventListener("keydown",e=>{if(e.key==="Enter")addHabit()});
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
render();
</script>
</body>
</html>
